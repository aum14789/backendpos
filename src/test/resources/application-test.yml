spring:
  # The datasource is supplied by EmbeddedPostgresEnvironmentPostProcessor, which
  # boots a real PostgreSQL for the suite (registered in META-INF/spring.factories).
  # An in-memory substitute cannot run the PostgreSQL-only baseline DDL.
  flyway:
    # The consolidated V1 baseline is itself under test, so let it apply.
    enabled: true
    # The consolidated V1 baseline applies cleanly and directly without test-only relaxation.
    locations: classpath:db/migration

sunpos:
  jwt:
    secret: 9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b
    expiration-ms: 3600000
  line:
    enabled: true
    channel-id: "test-channel-id"
    channel-secret: "test-channel-secret"
    channel-access-token: "test-access-token"
    mock-mode: true
